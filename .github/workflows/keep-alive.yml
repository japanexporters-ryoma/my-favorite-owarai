name: Keep Render Alive

on:
  schedule:
    # 日本時間 午前6:00 〜 午後11:00（UTC 21:00 〜 翌日13:50）の間だけ10分おきに通信
    # ※夜間（午後11時〜午前6時）は自動で停止し、サーバーをお休み（スリープ）させます
    - cron: '*/10 21-23,0-13 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Service
        run: |
          curl -sS --max-time 60 https://otousan-owarai.onrender.com/api/presets || true
