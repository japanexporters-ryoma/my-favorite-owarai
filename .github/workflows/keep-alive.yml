name: Keep Render Alive

on:
  schedule:
    # 10分おきにRenderサーバーへアクセスしてスリープを防止
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Service
        run: |
          curl -sS --max-time 60 https://otousan-owarai.onrender.com/api/ping || true
