<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>😊</text></svg>">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#f59e0b" />
    <meta name="description" content="お父さんが大好きな芸人や有名人のYouTube動画をワンタップで再生できる介護・ベッドサイド向けシアターアプリ" />
    <title>お父さんのお笑いシアター</title>
    <style>
      #initial-loader {
        position: fixed;
        inset: 0;
        background: #f8fafc;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        color: #334155;
        z-index: 9999;
      }
      .loader-spinner {
        width: 56px;
        height: 56px;
        border: 4px solid #fde68a;
        border-top-color: #f59e0b;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin-bottom: 20px;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body class="bg-slate-50 min-h-screen">
    <div id="root">
      <div id="initial-loader">
        <div class="loader-spinner"></div>
        <div style="font-size: 28px; margin-bottom: 8px;">😊</div>
        <div style="font-weight: 800; font-size: 18px; color: #1e293b;">お父さんのお笑いシアター</div>
        <div style="font-size: 13px; color: #64748b; margin-top: 6px;">画面を準備しています...</div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
